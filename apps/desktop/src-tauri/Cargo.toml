[package]
name = "zhichi-desktop"
version = "0.1.0"
description = "咫尺 · AI 角色对话应用（桌面端壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# 只用来取「文档」目录（备份落盘位置）；tauri 内部也是用它
dirs = "7"

[profile.release]
# 桌面壳不跑重逻辑（全部在 WebView 里），体积优先
strip = true
lto = true
codegen-units = 1
panic = "abort"
